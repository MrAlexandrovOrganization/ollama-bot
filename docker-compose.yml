services:
  ollama-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:2b}
      WHISPER_GRPC_HOST: whisper-ingress
      WHISPER_GRPC_PORT: "50053"
    networks:
      - ollama-net
      - whisper-net
    extends:
      file: docker-compose.base.yml
      service: base

networks:
  ollama-net:
    external: true
    name: ollama-net
  whisper-net:
    external: true
    name: whisper-net
