services:
  ollama-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:7b}
      WHISPER_GRPC_HOST: whisper-ingress
      WHISPER_GRPC_PORT: "50053"
      # Shared local Telegram Bot API server (infra/telegram-bot-api)
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
      # Route Telegram API traffic through Xray SOCKS5 proxy on host
      HTTPS_PROXY: socks5://host.docker.internal:10808
      NO_PROXY: ollama,whisper-ingress,telegram-bot-api,localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ollama-net
      - whisper-net
      - telegram-net
    extends:
      file: docker-compose.base.yml
      service: base

networks:
  ollama-net:
    external: true
    name: ollama-net
  whisper-net:
    external: true
    name: whisper-net
  telegram-net:
    external: true
